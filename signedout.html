<!DOCTYPE html>

<head>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
  /* A quiet landing. One message, one action, nothing else to decide. */
  body { display: flex; flex-direction: column; min-height: 100vh; }

  .bar { padding: 26px 48px; }
  .bar a {
    font-family: var(--serif); font-size: 19px; font-weight: 700;
    color: var(--ink); text-decoration: none; letter-spacing: -0.01em;
  }
  .bar a span { color: var(--gold-2); }

  main {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 40px 24px 96px; text-align: center;
  }
  .panel { max-width: 34rem; }

  .mark {
    width: 54px; height: 54px; margin: 0 auto 32px;
    border-radius: 50%; background: var(--green-pale);
    display: grid; place-items: center;
  }
  .mark svg { width: 26px; height: 26px; stroke: var(--green-2); }

  h1 {
    font-size: clamp(30px, 5vw, 40px); font-weight: 700;
    letter-spacing: -0.02em; line-height: 1.1; color: var(--ink);
  }
  .sub {
    margin-top: 16px; font-size: 17.5px; font-weight: 300;
    color: var(--ink-2); line-height: 1.65;
  }

  .actions { margin-top: 40px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .btn {
    display: inline-block; font-size: 15px; font-weight: 500;
    background: var(--green-2); color: var(--white);
    padding: 15px 40px; border-radius: 999px;
    text-decoration: none; transition: background 0.2s;
  }
  .btn:hover { background: var(--ink); }
  .quiet { font-size: 14.5px; color: var(--muted); text-decoration: none; }
  .quiet:hover { color: var(--ink); }

  .verse {
    margin-top: 72px; padding-top: 28px;
    border-top: 1px solid var(--line);
    font-family: var(--serif); font-style: italic;
    font-size: 16px; color: var(--ink-2); line-height: 1.7;
  }
  .verse cite {
    display: block; margin-top: 10px; font-style: normal;
    font-family: var(--sans); font-size: 11px; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold-2);
  }

  .foot {
    padding: 28px 24px 40px; text-align: center;
    font-size: 12.5px; color: var(--muted); line-height: 1.8;
  }
  .foot a { color: inherit; text-decoration: none; }
  .foot a:hover { color: var(--ink); }

  @media (max-width: 640px) {
    .bar { padding: 20px; }
    main { padding: 24px 20px 72px; }
    .verse { margin-top: 56px; }
  }
</style>
</head>
<body>

<div class="bar">
  <a href="index.html">Ministry<span>AI</span></a>
</div>

<main>
  <div class="panel">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5"/>
      </svg>
    </div>

    <h1>You're signed out</h1>
    <p class="sub">Your session has ended on this device.</p>

    <div class="actions">
      <a class="btn" href="signin.html">Sign in again</a>
      <a class="quiet" href="index.html">Back to ministry-ai.org</a>
    </div>

    <p class="verse">
      "The Lord bless you and keep you; the Lord make his face to shine upon you."
      <cite>Numbers 6:24–25</cite>
    </p>
  </div>
</main>

<div class="foot">
  <a href="index.html">Home</a> &middot;
  <a href="about.html">About</a> &middot;
  <a href="contact.html">Contact</a> &middot;

</div>

</body>
</html>
